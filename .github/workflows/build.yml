name: Build and test

on:
  push:            # every branch, so feature branches get a Mac build too
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Logic tests
        run: python tests/test_macos_logic.py
      - name: Smoke test (from source)
        run: python tools/smoke_test.py
      - name: Build PadDock.app
        run: python tools/build.py
      - name: Smoke test (built app)
        run: python tools/smoke_test.py --exe build/app/PadDock.app/Contents/MacOS/PadDock
      - uses: actions/upload-artifact@v4
        with:
          name: PadDock-macos
          path: |
            dist/*-macos.dmg
            dist/*-macos.zip
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Logic tests
        run: python tests/test_macos_logic.py
      - name: Smoke test (from source)
        run: python tools/smoke_test.py
      - name: Build PadDock.exe and installer
        run: python tools/build.py
      - name: Smoke test (built app)
        run: python tools/smoke_test.py --exe build/app/PadDock/PadDock.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PadDock-windows
          path: |
            dist/PadDock-Setup-*.exe
            dist/PadDock-*-portable.zip
          if-no-files-found: error
