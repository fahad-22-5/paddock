name: Build and test

on:
  push:            # every branch, so feature branches get a Mac build too
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash    # same scripts on macOS and Windows

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt 2>&1 | tail -n 25 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Logic tests
        run: python tests/test_macos_logic.py 2>&1 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Smoke test (from source)
        run: python tools/smoke_test.py 2>&1 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Build PadDock.app
        run: python tools/build.py 2>&1 | tail -n 40 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Smoke test (built app)
        run: python tools/smoke_test.py --exe build/app/PadDock.app/Contents/MacOS/PadDock 2>&1 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: PadDock-macos
          path: |
            dist/*-macos.dmg
            dist/*-macos.zip
          if-no-files-found: error
      - name: Report
        if: always()
        run: |
          { echo '### macOS report'; echo '```'; tail -c 60000 report.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt 2>&1 | tail -n 25 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Logic tests
        run: python tests/test_macos_logic.py 2>&1 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Smoke test (from source)
        run: python tools/smoke_test.py 2>&1 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Build PadDock.exe and installer
        run: python tools/build.py 2>&1 | tail -n 40 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - name: Smoke test (built app)
        run: python tools/smoke_test.py --exe build/app/PadDock/PadDock.exe 2>&1 | tee -a report.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: PadDock-windows
          path: |
            dist/PadDock-Setup-*.exe
            dist/PadDock-*-portable.zip
          if-no-files-found: error
      - name: Report
        if: always()
        run: |
          { echo '### Windows report'; echo '```'; tail -c 60000 report.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
